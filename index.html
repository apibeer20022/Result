<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardiac Parameter Comparison: QGS vs 4DM vs MRI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 เปรียบเทียบค่าพารามิเตอร์หัวใจ (LVEF, EDV, ESV)</h2>
        <p>การศึกษาเปรียบเทียบระหว่างโปรแกรม QGS, 4DM และ Cardiac MRI</p>
        
        <canvas id="cardiacChart"></canvas>
    </div>

    <script>
        // ใส่ข้อมูลจำลอง (คุณเบียร์สามารถเปลี่ยนตัวเลขเหล่านี้เป็นข้อมูลวิจัยจริงได้เลยครับ)
        const labels = ['LVEF (%)', 'EDV (mL)', 'ESV (mL)'];
        
        const dataQGS = [53.2, 120.0, 48.0]; // ข้อมูลค่าเฉลี่ยจาก QGS
        const data4DM = [59.0, 127.0, 45.0]; // ข้อมูลค่าเฉลี่ยจาก 4DM
        const dataMRI = [60.6, 137.0, 50.0]; // ข้อมูลอ้างอิงจาก cMRI

        const ctx = document.getElementById('cardiacChart').getContext('2d');
        const cardiacChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'QGS',
                        data: dataQGS,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Corridor 4DM',
                        data: data4DM,
                        backgroundColor: 'rgba(255, 99, 132, 0.7)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1
                    },
                    {
                        label: 'Cardiac MRI (Gold Standard)',
                        data: dataMRI,
                        backgroundColor: 'rgba(75, 192, 192, 0.7)',
                        borderColor: 'rgba(75, 192, 192, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Value / Volume'
                        }
                    }
                }
            }
        });
    </script>

</body>
</html>
