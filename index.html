<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPS/QGS vs 4D-M Cardiac Parameters</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #2c3e50; }
        .container { max-width: 900px; margin: auto; }
        .chart-wrapper { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 ผลการเปรียบเทียบพารามิเตอร์หัวใจ (QPS/QGS vs 4D-M)</h1>
        <p>สร้างจากข้อมูลวิจัย: การเปรียบเทียบค่าพารามิเตอร์การทำงานของหัวใจ</p>

        <div class="chart-wrapper">
            <canvas id="volumeChart"></canvas>
        </div>

        <div class="chart-wrapper">
            <canvas id="lvefChart"></canvas>
        </div>
    </div>

    <script>
        // ข้อมูลกราฟเปรียบเทียบปริมาตร (Median values)
        const ctxVol = document.getElementById('volumeChart').getContext('2d');
        new Chart(ctxVol, {
            type: 'bar',
            data: {
                labels: ['Rest EDV (mL)', 'Stress EDV (mL)', 'Rest ESV (mL)', 'Stress ESV (mL)'],
                datasets: [
                    { label: 'QPS/QGS', data: [67.0, 67.0, 20.0, 22.0], backgroundColor: '#3498db' },
                    { label: '4D-M', data: [83.0, 84.0, 25.0, 27.0], backgroundColor: '#e74c3c' }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'เปรียบเทียบค่าปริมาตรเชิงมัธยฐาน (EDV, ESV)', font: { size: 16 } }
                }
            }
        });

        // ข้อมูลกราฟเปรียบเทียบประสิทธิภาพการบีบตัว (Mean values)
        const ctxLvef = document.getElementById('lvefChart').getContext('2d');
        new Chart(ctxLvef, {
            type: 'bar',
            data: {
                labels: ['Rest LVEF (%)', 'Stress LVEF (%)'],
                datasets: [
                    { label: 'QPS/QGS', data: [66.67, 65.24], backgroundColor: '#2ecc71' },
                    { label: '4D-M', data: [65.21, 65.16], backgroundColor: '#f39c12' }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: 'เปรียบเทียบค่าประสิทธิภาพการบีบตัวเฉลี่ย (LVEF)', font: { size: 16 } }
                },
                scales: { y: { min: 40, max: 80 } }
            }
        });
    </script>
</body>
</html>
